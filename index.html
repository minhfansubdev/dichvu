<!-- Tác giả bản quyền: Minh Fansub PTL -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Dịch vụ - Minh Fansub PTL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #2b2b36;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #5865F2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #ccc;
        }
        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1e1e24;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }
        select:focus, input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #5865F2;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #4752C4;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hệ Thống Dịch Vụ</h2>
        
        <div class="form-group">
            <label for="serviceSelect">Chọn loại dịch vụ:</label>
            <select id="serviceSelect" onchange="toggleFields()">
                <option value="" disabled selected>-- Vui lòng chọn dịch vụ --</option>
                <option value="Làm bài IOE">Làm bài IOE</option>
                <option value="Buff tương tác">Dịch vụ Buff tương tác</option>
                <option value="Dame acc">Dịch vụ Dame acc</option>
            </select>
        </div>

        <div id="ioeFields" class="hidden">
            <div class="form-group">
                <label for="username">Tài khoản IOE:</label>
                <input type="text" id="username" placeholder="Nhập tài khoản đăng nhập...">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu IOE:</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu...">
            </div>
        </div>

        <div id="linkField" class="form-group">
            <label for="linkInput">Nhập liên kết (Link):</label>
            <input type="text" id="linkInput" placeholder="Nhập đường link (bài viết, trang cá nhân, v.v.)...">
        </div>

        <div class="form-group">
            <label for="idCode">Nhập mã nhận dạng (ID):</label>
            <input type="text" id="idCode" placeholder="Nhập mã ID của bạn...">
        </div>

        <button onclick="submitService()">Gửi Yêu Cầu</button>

        <div class="footer">
            Tác giả bản quyền: Minh Fansub PTL
        </div>
    </div>

    <script>
        // Tác giả bản quyền: Minh Fansub PTL
        
        function toggleFields() {
            const service = document.getElementById("serviceSelect").value;
            const ioeFields = document.getElementById("ioeFields");
            const linkField = document.getElementById("linkField");
            
            if (service === "Làm bài IOE") {
                ioeFields.classList.remove("hidden");
                linkField.classList.add("hidden");
                document.getElementById("linkInput").value = ""; 
            } else {
                ioeFields.classList.add("hidden");
                linkField.classList.remove("hidden");
                document.getElementById("username").value = ""; 
                document.getElementById("password").value = "";
            }
        }

        function submitService() {
            const service = document.getElementById("serviceSelect").value;
            const linkInput = document.getElementById("linkInput").value;
            const idCode = document.getElementById("idCode").value;
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (!service) {
                alert("Vui lòng chọn một loại dịch vụ!");
                return;
            }
            if (service !== "Làm bài IOE" && !linkInput.trim()) {
                alert("Vui lòng nhập liên kết (Link)!");
                return;
            }
            if (!idCode.trim()) {
                alert("Vui lòng nhập mã nhận dạng!");
                return;
            }
            if (service === "Làm bài IOE" && (!username.trim() || !password.trim())) {
                alert("Vui lòng nhập đầy đủ tài khoản và mật khẩu cho dịch vụ IOE!");
                return;
            }

            const webhookUrl = "https://discord.com/api/webhooks/1510618350940717156/QjxmelO4mSUfTBfTuIlfYr7Po_26QGUt-Jmp8FMf5BHe0QOO7oFfaNZSS3Mh1o_hmERF"; 

            // Cập nhật ID Role ở đây
            const roleVIP = "<@&1472485476404301946>";   
            const roleAdmin = "<@&1506355840410718269>";  
            const roleSupport = "<@&1520126181041508483>";
            
            const pings = `${roleVIP} ${roleAdmin} ${roleSupport}`;

            // Định dạng khối nổi bật cho Loại dịch vụ
            let message = `${pings}\n🔔 **CÓ YÊU CẦU DỊCH VỤ MỚI** 🔔\n\`\`\`ini\n[ LOẠI DỊCH VỤ: ${service} ]\n\`\`\``;

            if (service === "Làm bài IOE") {
                message += `\n**Tài khoản (Bấm để copy):**\n\`\`\`text\n${username}\n\`\`\`\n**Mật khẩu (Bấm để copy):**\n\`\`\`text\n${password}\n\`\`\`\n**Mã nhận dạng (Bấm để copy):**\n\`\`\`text\n${idCode}\n\`\`\``;
            } else {
                message += `\n**Liên kết (Bấm để copy):**\n\`\`\`text\n${linkInput}\n\`\`\`\n**Mã nhận dạng (Bấm để copy):**\n\`\`\`text\n${idCode}\n\`\`\``;
            }

            const payload = {
                content: message
            };

            fetch(webhookUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert("Yêu cầu đã được gửi thành công!");
                    document.getElementById("serviceSelect").value = ""; 
                    document.getElementById("linkInput").value = ""; 
                    document.getElementById("idCode").value = ""; 
                    document.getElementById("username").value = "";
                    document.getElementById("password").value = "";
                    toggleFields(); 
                } else {
                    alert("Đã xảy ra lỗi khi kết nối với Discord.");
                }
            })
            .catch(error => {
                console.error("Lỗi:", error);
                alert("Lỗi kết nối mạng hoặc hệ thống.");
            });
        }
    </script>
</body>
</html>
